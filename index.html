<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gully football in a 3D colony park. 3 vs 3 against Rohan's team, with panna, chakma, power cuts and Mummy calling you home.">
<meta property="og:title" content="Colony Park Football">
<meta property="og:description" content="Gully football in a 3D colony park. Play in your browser, no download.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://gullyfootball.ritikeshvali.com/">
<meta name="theme-color" content="#f3c58f">
<title>Colony Park Football</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: full-screen 3D canvas, HUD pinned to the top, touch controls at the bottom corners, menu/pause/result as centered cards. One evening-park look. */
:root {
  --sky: #f3c58f;
  --ink: #2b1d14;
  --chalk: #fff8ec;
  --brick: #c4532f;
  --gold: #ffd36e;
  --blue: #3d8fd1;
  --glass: rgba(43, 29, 20, 0.55);
  --card: rgba(43, 29, 20, 0.9);
  --font: "Baloo 2", ui-rounded, "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--sky); color: var(--chalk); font-family: var(--font); }
body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#game { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
button { font-family: var(--font); }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.hud { position: fixed; pointer-events: none; z-index: 5; }
.hud-top {
  top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
}
.left { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.pill {
  background: var(--glass); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  border-radius: 999px; padding: 5px 13px; font-weight: 700; font-size: 15px;
  font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 6px; white-space: nowrap;
}
.pill em { font-style: normal; color: var(--gold); font-size: 18px; }
.pill em.them { color: #9fd0ff; }
.pill i { font-style: normal; opacity: .7; }
.clock.late { background: rgba(196, 83, 47, 0.85); }
.right { display: flex; gap: 6px; align-items: center; pointer-events: auto; }
.icon-btn {
  appearance: none; border: 0; cursor: pointer; color: var(--chalk);
  background: var(--glass); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  border-radius: 999px; width: 38px; height: 38px; display: grid; place-items: center;
  font: 800 13px var(--font); letter-spacing: .04em; touch-action: manipulation;
}
.icon-btn svg { width: 18px; height: 18px; }

.tut {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 5; pointer-events: none;
  top: calc(62px + env(safe-area-inset-top, 0px));
  background: var(--gold); color: var(--ink); font-weight: 700; font-size: 15px;
  border-radius: 16px; padding: 6px 16px; box-shadow: 0 4px 0 rgba(0,0,0,.18);
  width: max-content; max-width: calc(100% - 32px); text-align: center; box-sizing: border-box;
}
.tut b { font-weight: 800; opacity: .55; margin-right: 6px; }

.hint {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  background: var(--glass); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  border-radius: 12px; padding: 8px 14px; font-size: 13px; font-weight: 500; text-align: center;
  width: max-content; max-width: calc(100% - 32px); pointer-events: none; z-index: 5;
}

.toast {
  position: fixed; left: 50%; top: 32%; transform: translate(-50%, -50%) scale(.6); opacity: 0;
  font-size: clamp(34px, 9.5vw, 88px); font-weight: 800; color: var(--gold); letter-spacing: .01em; white-space: nowrap;
  text-shadow: 0 4px 0 var(--brick), 0 10px 24px rgba(0,0,0,.35);
  pointer-events: none; z-index: 6; transition: transform .35s cubic-bezier(.2,1.6,.4,1), opacity .25s;
}
.toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.callout {
  position: fixed; left: 50%; top: 22%; transform: translate(-50%, 10px); opacity: 0;
  background: var(--card); border-radius: 14px; padding: 8px 16px; font-size: 17px; font-weight: 700;
  width: max-content; max-width: calc(100% - 32px); text-align: center; box-sizing: border-box;
  pointer-events: none; z-index: 6; transition: transform .25s, opacity .25s;
}
.callout.show { opacity: 1; transform: translate(-50%, 0); }
.callout.trick { background: var(--gold); color: var(--ink); font-size: 20px; font-weight: 800; }

/* touch controls */
.touch { display: none; }
@media (pointer: coarse) { .touch { display: block; } .hint { display: none; } }
.stick {
  position: fixed; z-index: 7; touch-action: none;
  left: calc(22px + env(safe-area-inset-left, 0px));
  bottom: calc(26px + env(safe-area-inset-bottom, 0px));
  width: 132px; height: 132px; border-radius: 50%;
  background: rgba(43,29,20,.32); border: 2px solid rgba(255,248,236,.45);
}
.knob {
  position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px;
  border-radius: 50%; background: rgba(255,248,236,.9); box-shadow: 0 4px 10px rgba(0,0,0,.25);
}
.kick {
  position: fixed; z-index: 7; touch-action: none; appearance: none; border: 0; cursor: pointer;
  right: calc(26px + env(safe-area-inset-right, 0px));
  bottom: calc(38px + env(safe-area-inset-bottom, 0px));
  width: 104px; height: 104px; border-radius: 50%;
  background: conic-gradient(var(--gold) calc(var(--charge, 0) * 360deg), var(--brick) 0);
  color: var(--chalk); font: 800 20px var(--font); letter-spacing: .04em;
  box-shadow: 0 6px 0 #7e3019, 0 10px 18px rgba(0,0,0,.3);
}
.kick span { display: grid; place-items: center; position: absolute; inset: 7px; border-radius: 50%; background: var(--brick); }
.kick.down { transform: translateY(4px); box-shadow: 0 2px 0 #7e3019, 0 4px 8px rgba(0,0,0,.3); }
.trick {
  position: fixed; z-index: 7; touch-action: none; appearance: none; border: 0; cursor: pointer;
  right: calc(43px + env(safe-area-inset-right, 0px));
  bottom: calc(160px + env(safe-area-inset-bottom, 0px));
  width: 70px; height: 70px; border-radius: 50%;
  background: var(--gold); color: var(--ink); font: 800 14px var(--font); letter-spacing: .04em;
  box-shadow: 0 5px 0 #b8892c, 0 8px 14px rgba(0,0,0,.25);
}
.trick.down { transform: translateY(3px); box-shadow: 0 2px 0 #b8892c, 0 4px 8px rgba(0,0,0,.25); }
.pass {
  position: fixed; z-index: 7; touch-action: none; appearance: none; border: 0; cursor: pointer;
  right: calc(144px + env(safe-area-inset-right, 0px));
  bottom: calc(52px + env(safe-area-inset-bottom, 0px));
  width: 70px; height: 70px; border-radius: 50%;
  background: var(--blue); color: var(--chalk); font: 800 15px var(--font); letter-spacing: .04em;
  box-shadow: 0 5px 0 #24608f, 0 8px 14px rgba(0,0,0,.25);
}
.pass.down { transform: translateY(3px); box-shadow: 0 2px 0 #24608f, 0 4px 8px rgba(0,0,0,.25); }
.switch {
  position: fixed; z-index: 7; touch-action: none; appearance: none; cursor: pointer;
  left: calc(40px + env(safe-area-inset-left, 0px));
  bottom: calc(176px + env(safe-area-inset-bottom, 0px));
  min-width: 96px; height: 40px; padding: 0 14px; border-radius: 99px;
  background: var(--glass); color: var(--chalk); border: 2px solid rgba(255,248,236,.45); font: 800 14px var(--font); letter-spacing: .03em;
}
.switch:active { background: rgba(255,211,110,.35); }
.trick small { display: block; font-size: 10px; font-weight: 700; opacity: .65; letter-spacing: .02em; margin-top: -2px; }
.charge {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 5;
  bottom: calc(56px + env(safe-area-inset-bottom, 0px));
  width: 160px; height: 8px; border-radius: 99px; background: var(--glass); overflow: hidden; pointer-events: none;
}
.charge i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), var(--brick)); }
@media (pointer: coarse) { .charge { display: none; } }

/* menus */
body[data-state="menu"] .hud-top, body[data-state="menu"] .touch, body[data-state="menu"] .hint,
body[data-state="ended"] .touch, body[data-state="ended"] .hint,
body[data-state="paused"] .touch, body[data-state="paused"] .hint { display: none !important; }
.overlay {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
  background: linear-gradient(180deg, rgba(43,29,20,.1), rgba(43,29,20,.45));
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
  overflow-y: auto;
}
.card {
  width: 100%; max-width: 420px; box-sizing: border-box; margin-block: 16px;
  background: var(--card); border-radius: 22px; padding: 22px 20px 20px;
  box-shadow: 0 18px 50px rgba(0,0,0,.35);
  display: flex; flex-direction: column; gap: 14px;
}
.card h1 { margin: 0; font-size: 34px; line-height: 1; font-weight: 800; letter-spacing: .005em; }
.card h2 { margin: 0; font-size: 28px; line-height: 1.05; font-weight: 800; color: var(--gold); text-wrap: balance; }
.card p { margin: 0; font-size: 15px; opacity: .85; line-height: 1.35; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .75; }
.group { display: flex; flex-direction: column; gap: 8px; }
.kids { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.kid {
  appearance: none; border: 2px solid transparent; cursor: pointer; color: var(--chalk);
  background: rgba(255,248,236,.08); border-radius: 14px; padding: 10px 4px 6px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 700; font-size: 14px;
}
.kid.on { border-color: var(--gold); background: rgba(255,211,110,.14); }
.fig { position: relative; width: 34px; height: 46px; }
.fig .h { position: absolute; left: 7px; top: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--skin); box-shadow: inset 0 6px 0 #1d1410; }
.fig .b { position: absolute; left: 3px; top: 21px; width: 28px; height: 18px; border-radius: 5px 5px 2px 2px; background: var(--shirt); box-shadow: inset 0 -5px 0 var(--stripe); }
.fig .s { position: absolute; left: 6px; top: 39px; width: 22px; height: 7px; border-radius: 2px; background: var(--shorts); }
.team-note { font-size: 13px; opacity: .75; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: rgba(255,248,236,.08); border-radius: 12px; padding: 4px; }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.seg button {
  appearance: none; border: 0; cursor: pointer; color: var(--chalk); background: transparent;
  border-radius: 9px; padding: 8px; font-weight: 700; font-size: 15px;
}
.seg button.on { background: var(--chalk); color: var(--ink); }
.play {
  appearance: none; border: 0; cursor: pointer; color: var(--chalk); background: var(--brick);
  border-radius: 14px; padding: 14px; font-size: 20px; font-weight: 800; letter-spacing: .02em;
  box-shadow: 0 5px 0 #7e3019;
}
.play:active { transform: translateY(3px); box-shadow: 0 2px 0 #7e3019; }
.ghost {
  appearance: none; border: 2px solid rgba(255,248,236,.35); cursor: pointer; color: var(--chalk); background: transparent;
  border-radius: 14px; padding: 11px; font-size: 16px; font-weight: 700;
}
.tricks { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.3; }
.tricks li { display: flex; gap: 8px; }
.tricks b { color: var(--gold); white-space: nowrap; }
.final { display: flex; justify-content: center; align-items: baseline; gap: 12px; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.final em { font-style: normal; font-size: 40px; color: var(--gold); }
.result { text-align: center; font-weight: 700; font-size: 17px; }

.loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 30; background: var(--sky); color: var(--ink); font-weight: 700; font-size: 18px; }
@media (prefers-reduced-motion: reduce) { .toast, .callout { transition: none; } }
</style>
</head>
<body>

<canvas id="game" aria-label="3D colony park where you play 3 vs 3 football against Rohan's team"></canvas>

<div class="hud hud-top">
  <div class="left">
    <div class="pill"><span id="pName">Golu</span><em id="sYou">0</em><i>:</i><em class="them" id="sAi">0</em><span>Rohan</span></div>
    <div class="pill clock" id="clockPill"><span id="clock">3:00</span></div>
  </div>
  <div class="right">
    <button class="icon-btn" id="soundBtn" type="button" aria-label="Sound on or off"></button>
    <button class="icon-btn" id="langBtn" type="button" aria-label="Switch language">HI</button>
    <button class="icon-btn" id="pauseBtn" type="button" aria-label="Pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>
    </button>
  </div>
</div>

<div class="tut" id="tut" hidden></div>
<div class="hint" data-t="ui.keys"></div>
<div class="charge" hidden id="chargeBar"><i id="chargeFill"></i></div>

<div class="touch">
  <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
  <button class="trick" id="trickBtn" type="button" aria-label="Trick. Tap, or swipe up, down or sideways">TRICK<small data-t="ui.swipe"></small></button>
  <button class="kick" id="kickBtn" type="button" aria-label="Kick, hold to power up"><span>KICK</span></button>
  <button class="pass" id="passBtn" type="button" aria-label="Pass to a teammate">PASS</button>
  <button class="switch" id="switchBtn" type="button" aria-label="Switch to the teammate nearest the ball" data-t="ui.switch"></button>
</div>

<div class="toast" id="toast"></div>
<div class="callout" id="callout"></div>

<div class="overlay" id="menu">
  <div class="card">
    <div class="group">
      <h1>Colony Park</h1>
      <p data-t="ui.tagline"></p>
    </div>
    <div class="group">
      <span class="label" data-t="ui.choose"></span>
      <div class="kids" id="kids"></div>
      <span class="team-note" id="teamNote"></span>
    </div>
    <div class="group">
      <span class="label" data-t="ui.goals"></span>
      <div class="seg">
        <button type="button" data-goal="bricks" data-t="ui.bricks"></button>
        <button type="button" data-goal="chappals" data-t="ui.chappals"></button>
      </div>
    </div>
    <div class="group">
      <span class="label" data-t="ui.weather"></span>
      <div class="seg three">
        <button type="button" data-weather="clear" data-t="ui.clear"></button>
        <button type="button" data-weather="rain" data-t="ui.rain"></button>
        <button type="button" data-weather="random" data-t="ui.random"></button>
      </div>
    </div>
    <div class="group">
      <span class="label" data-t="ui.time"></span>
      <div class="seg three">
        <button type="button" data-mins="1">1 min</button>
        <button type="button" data-mins="2">2 min</button>
        <button type="button" data-mins="3">3 min</button>
      </div>
    </div>
    <div class="group">
      <span class="label" data-t="ui.language"></span>
      <div class="seg">
        <button type="button" data-lang="hinglish">Hinglish</button>
        <button type="button" data-lang="en">English</button>
      </div>
    </div>
    <button class="play" id="playBtn" type="button" data-t="ui.play"></button>
  </div>
</div>

<div class="overlay" id="pauseCard" hidden>
  <div class="card">
    <div class="group">
      <h2 data-t="pause.title"></h2>
      <p data-t="pause.sub"></p>
    </div>
    <button class="play" id="resumeBtn" type="button" data-t="ui.resume"></button>
    <div class="group">
      <span class="label" data-t="ui.controls"></span>
      <ul class="tricks" id="trickList"></ul>
    </div>
    <div class="group">
      <span class="label" data-t="ui.time"></span>
      <div class="seg three">
        <button type="button" data-mins="1">1 min</button>
        <button type="button" data-mins="2">2 min</button>
        <button type="button" data-mins="3">3 min</button>
      </div>
    </div>
    <button class="ghost" id="restartBtn" type="button" data-t="ui.restart"></button>
    <button class="ghost" id="toMenuBtn" type="button" data-t="ui.menu"></button>
  </div>
</div>

<div class="overlay" id="endCard" hidden>
  <div class="card">
    <div class="group">
      <h2 id="endTitle"></h2>
      <p id="endSub"></p>
    </div>
    <div class="final"><span id="fName">Golu</span><em id="fYou">0</em><span>:</span><em id="fAi">0</em><span>Rohan</span></div>
    <div class="result" id="endResult"></div>
    <button class="play" id="againBtn" type="button" data-t="ui.rematch"></button>
    <button class="ghost" id="changeBtn" type="button" data-t="ui.change"></button>
  </div>
</div>

<div class="loading" id="loading">Opening the park gate…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

        if (receiverT <= 0 || receiver.hidden || ball.out) clearReceiver();
      }
      for (let i = 0; i < 3; i++) updateBall(sdt / 3);
      match.update(sdt);
      Tutorial.update(sdt);
      PowerCut.update(sdt);
      if (flashT > 0) { flashT -= dt; hemi.intensity = baseHemi + Math.max(flashT, 0) / 0.18 * 1.6; }
      renderClock();
    } else {
      for (const a of agents) animateAgent(a, 0);
    }
    if (match.state === 'fetch' && match.st > 0.9) ballMesh.visible = false;
    ballRoot.position.copy(ball.pos);
    if (squashT > 0) { squashT -= dt; const q = squashAmt * Math.max(squashT, 0) / 0.12; ballRoot.scale.set(1 + q, 1 - q, 1 + q); } else ballRoot.scale.set(1, 1, 1);
    ballMesh.quaternion.copy(ball.quat);
    if (match.state !== 'paused') { Banter.update(dt); aunty.update(dt); kulfi.update(dt); updateParticles(dt); updateRain(dt); }
    Ambience.update(dt);
    updateMarkers(clock.elapsedTime);
    updateCamera(dt);
    updateOcclusion(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  bus.on('GOAL', () => { aiWait = 2.2; });
  $('loading').hidden = true;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
